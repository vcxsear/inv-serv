<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <div class="container">
        <h1>Awesome Animations</h1>
        
        <!-- Floating Cards -->
        <section class="animation-section">
            <h2>Floating Cards</h2>
            <div class="cards-wrapper">
                <div class="card card-1">Design</div>
                <div class="card card-2">Code</div>
                <div class="card card-3">Deploy</div>
            </div>
        </section>

        <!-- Animated Gradient -->
        <section class="animation-section">
            <h2>Gradient Animation</h2>
            <div class="gradient-box"></div>
        </section>

        <!-- Particle Effect -->
        <section class="animation-section">
            <h2>Particle Hover Effect</h2>
            <button class="particle-btn">Hover Me</button>
        </section>

        <!-- Neon Text -->
        <section class="animation-section">
            <h2>Neon Text</h2>
            <div class="neon-text">AWESOME</div>
        </section>

        <!-- Loading Animation -->
        <section class="animation-section">
            <h2>Loading Animation</h2>
            <div class="loader"></div>
        </section>

        <!-- Wave Animation -->
        <section class="animation-section">
            <h2>Wave Effect</h2>
            <div class="wave-container">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </section>

        <!-- Morphing Shape -->
        <section class="animation-section">
            <h2>Morphing Shape</h2>
            <svg class="morph-svg" viewBox="0 0 100 100">
                <path class="morph-path" d="M50,10 L90,40 L70,90 L30,90 L10,40 Z"></path>
            </svg>
        </section>

        <!-- Interactive Buttons -->
        <section class="animation-section">
            <h2>Interactive Buttons</h2>
            <div class="buttons-wrapper">
                <button class="btn btn-primary">Click Me</button>
                <button class="btn btn-secondary">Hover</button>
                <button class="btn btn-tertiary">Press</button>
            </div>
        </section>
    </div>

    <script src="animations.js"></script>
</body>
</html>
