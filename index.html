<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Animations Showcase</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; }
        .box { width: 100px; height: 100px; margin: 20px; display: inline-block; }
        .fade { animation: fade 2s; }
        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .slide { animation: slide 2s; }
        @keyframes slide {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <h1>Awesome Animations Showcase</h1>
    <div class="box fade" style="background-color: red;"></div>
    <div class="box slide" style="background-color: blue;"></div>
    <div class="box fade" style="background-color: green;"></div>
    <div class="box slide" style="background-color: yellow;"></div>
    <script>
        // Add JavaScript code here for additional animations
        console.log('Welcome to the Awesome Animations Showcase!');
    </script>
</body>
</html>
